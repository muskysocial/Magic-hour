<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Reset your Magic Hour password</title></head>
<body style="margin:0;padding:32px 16px;background:#f4f6fb;font-family:Arial,sans-serif;color:#172033">
  <main style="max-width:520px;margin:0 auto;padding:36px 30px;background:#fff;border:1px solid #e4e8f0;border-radius:18px">
    <p style="margin:0 0 24px;font-size:24px;font-weight:800;letter-spacing:-.5px">Magic Hour</p>
    <h1 style="font-size:22px;margin:0 0 12px">Reset your password</h1>
    <p style="font-size:15px;line-height:1.65;color:#566176">We received a request to reset the password for your Magic Hour account. Use the secure link below to choose a new password.</p>
    <p style="margin:28px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;background:#635bff;color:#fff;text-decoration:none;border-radius:10px;font-weight:700">Reset password</a></p>
    <p style="font-size:13px;line-height:1.6;color:#7b8496">If you did not request a password reset, you can ignore this message. Your password will not change.</p>
    <p style="font-size:12px;color:#9aa2b1;margin-top:28px">Magic Hour</p>
  </main>
</body>
</html>
