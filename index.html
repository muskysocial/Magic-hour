<body>
  <main id="app" aria-live="polite">
    <div class="boot"><span class="boot-mark">m</span><span>magic hour</span></div>
  </main>
  <script>
  // If the app module cannot start, never leave visitors on an endless boot screen.
  window.setTimeout(function(){
    var root=document.getElementById("app");
    if(root && root.querySelector(".boot")){
      root.innerHTML='<section style="min-height:100vh;display:grid;place-content:center;text-align:center;padding:28px;background:#f4f7fb;color:#172337;font:16px system-ui"><h1 style="font-size:24px">Magic Hour is taking longer than expected</h1><p style="color:#aaa;max-width:360px;line-height:1.6">The app could not finish loading. Please reload the page or try again in Chrome.</p><button onclick="location.reload()" style="padding:13px 22px;border:0;border-radius:10px;background:#1769c2;color:white;font-weight:700">Reload Magic Hour</button></section>';
    }
  },12000);
  window.addEventListener("error",function(event){
    var root=document.getElementById("app");
    if(root && root.querySelector(".boot") && event.message){
      root.innerHTML='<section style="min-height:100vh;display:grid;place-content:center;text-align:center;padding:28px;background:#050505;color:#fff;font:16px system-ui"><h1 style="font-size:24px">Magic Hour could not start</h1><p style="color:#aaa;max-width:360px;line-height:1.6">A required app file failed to load. '+(event.message||"Unknown startup error")+(event.filename?" · "+event.filename.split("/").pop():"")+(event.lineno?" · line "+event.lineno:"")+'.</p><button onclick="location.reload()" style="padding:13px 22px;border:0;border-radius:10px;background:#8b5cf6;color:white;font-weight:700">Reload Magic Hour</button></section>';
    }
  });
 </script>
 <script type="module" src="./app.js?v=magichour-startup-recovery-20261126-v24"></script>
