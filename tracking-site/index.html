<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08111d">
<title>Shipment tracking</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111d;color:#f4f8fc;font:15px/1.5 system-ui,sans-serif}.panel{width:min(440px,calc(100% - 32px));padding:28px;border:1px solid #26384b;border-radius:20px;background:#101e2e;box-shadow:0 24px 70px #0008}.mark{font-size:32px}.muted{color:#9aadc0}a{display:inline-block;margin-top:14px;color:#55d6e8;font-weight:700}
</style>
</head>
<body>
<main class="panel">
<div class="mark">📦</div>
<h1>Opening secure shipment tracking</h1>
<p class="muted">Your shipment link is being transferred to the unified Magic Hour tracking page.</p>
<a id="continue" href="https://magichour-black.vercel.app/">Continue to tracking</a>
</main>
<script>
(function(){
  const destination=new URL("https://magichour-black.vercel.app/");
  const params=new URLSearchParams(location.search);
  for(const [key,value] of params)destination.searchParams.set(key,value);
  const target=destination.toString();
  document.getElementById("continue").href=target;
  location.replace(target);
})();
</script>
</body>
</html>
