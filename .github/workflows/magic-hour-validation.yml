name: Magic Hour validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, magic-hour-site-control-centre]

jobs:
  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser application JavaScript syntax
        run: node --input-type=module --check < app.js
      - name: Check API client JavaScript syntax
        run: node --input-type=module --check < api.js
      - name: Validate homepage WebP asset
        run: node -e "const fs=require('fs');const s=fs.readFileSync('assets/homepage-flight-attendant.webp.b64','utf8').trim();const b=Buffer.from(s,'base64');if(b.toString('ascii',0,4)!=='RIFF'||b.toString('ascii',8,12)!=='WEBP'||b.readUInt32LE(4)!==b.length-8)throw new Error('Homepage hero WebP asset is invalid');"
      - name: Check local shipment engine JavaScript syntax
        run: node --input-type=module --check < tracking-engine.js
      - name: Test local shipment route and movement engine
        run: node --test tracking-engine.test.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/admin-console/index.ts supabase/functions/campaign-service/index.ts supabase/functions/shipment-public/index.ts supabase/functions/shipment-push/index.ts supabase/functions/magic-hour-cards/index.ts supabase/functions/video-face-swap/index.ts
      - name: Test MP4 validation and billing inputs
        run: deno test supabase/functions/video-face-swap/mp4_test.ts
