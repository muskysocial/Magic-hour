name: Magic Hour validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [magic-hour-site-control-centre]

jobs:
  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser application JavaScript syntax
        run: node --input-type=module --check < app.js
      - name: Check API client JavaScript syntax
        run: node --input-type=module --check < api.js
