name: Deploy Magic Hour to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify required app files
        run: test -f index.html && test -f app.js && test -f api.js && test -f tracking-engine.js
      - name: Check application JavaScript syntax
        run: node --check app.js && node --check api.js && node --check tracking-engine.js
      - name: Test shipment journey engine
        run: node --test tracking-engine.test.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
